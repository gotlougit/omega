[package]
name = "omega-tools"
version = "0.1.0"
edition = "2021"

[dependencies]
omega-core = { path = "../omega-core" }
omega-llm = { path = "../omega-llm" }

tokio = { version = "1.0", features = ["full", "process"] }
async-trait = "0.1"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
glob = "0.3"
uuid = { version = "1.0", features = ["v4"] }
tracing = "0.1"
