[package]
name = "omega-tools"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[dependencies]
omega-core = { path = "../omega-core" }
omega-llm = { path = "../omega-llm" }

tokio = { version = "1.0", features = ["full", "process"] }
async-trait = "0.1"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4"] }
tracing = "0.1"
omega-tool-defs = { path = "../omega-tool-defs" }
