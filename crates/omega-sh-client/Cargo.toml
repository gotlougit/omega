[package]
name = "omega-sh-client"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[dependencies]
# Workspace crates
omega-core = { path = "../omega-core" }
omega-llm = { path = "../omega-llm" }
omega-tools = { path = "../omega-tools" }
omega-tool-defs = { path = "../omega-tool-defs" }

# Async
tokio = { version = "1.0", features = ["full", "net", "io-util"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Base64
base64 = "0.23"

# Logging
tracing = "0.1"

# Async trait
async-trait = "0.1"

# UUID
uuid = { version = "1.0", features = ["v4"] }

# Error handling
anyhow = "1.0"
