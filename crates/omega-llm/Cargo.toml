[package]
name = "omega-llm"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[dependencies]
# HTTP client
reqwest = { version = "0.13", features = ["form", "json", "stream"] }

# Async runtime
tokio = { version = "1.0", features = ["full"] }

# Tokio utilities for stream handling
tokio-util = { version = "0.7", features = ["io"] }

# Async stream creation
async-stream = "0.3"

# Stream handling
futures = "0.3"

# Async trait support
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"

# Logging
tracing = "0.1"

# OAuth token decoding and atomic credential persistence
base64 = "0.23"
tempfile = "3.24.0"
