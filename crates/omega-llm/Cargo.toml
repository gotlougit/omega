[package]
name = "omega-llm"
version = "0.1.0"
edition = "2021"

[dependencies]
# HTTP client
reqwest = { version = "0.13", features = ["json", "stream"] }

# Async runtime
tokio = { version = "1.0", features = ["full"] }

# Tokio utilities for stream handling
tokio-util = { version = "0.7", features = ["io"] }

# Async stream creation
async-stream = "0.3"

# Stream handling
futures = "0.3"

# Async trait support
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Base64 encoding for images
base64 = "0.23"

# UUID for request IDs
uuid = { version = "1.0", features = ["v4"] }

# DateTime for thinking blocks
chrono = { version = "0.4", features = ["serde"] }

# Regex for XML parsing
regex = "1.12.2"

# Logging
tracing = "0.1"
