[package]
name = "cli"
version = "0.1.0"
edition = "2021"

[dependencies]
crossterm = { version = "0.29", default-features = false, features = ["bracketed-paste", "events"] }
unicode-segmentation = "1"
unicode-width = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"

[dev-dependencies]
uuid = { version = "1.0", features = ["v4"] }
