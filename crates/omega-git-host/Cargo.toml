[package]
name = "omega-git-host"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Read-only self-hosted git forge + web UI over the omega project store"

[dependencies]
# Workspace crates
omega-projects = { path = "../omega-projects" }
omega-loop-client = { path = "../omega-loop-client" }

# Async runtime / HTTP
axum = "0.8"
http-body-util = "0.1"
tokio = { version = "1.0", features = ["full", "sync", "time"] }
tokio-stream = "0.1"

# Templating (sr.ht-style server-rendered pages)
minijinja = "2"

# Serialization (template contexts)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Timestamps (git log dates, session metadata)
chrono = { version = "0.4", features = ["serde"] }

# Error handling
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
pulldown-cmark = "0.13.4"

[build-dependencies]
# Pure-Rust Sass compiler — keeps the whole build in Rust (no dart-sass/node).
grass = "0.13"

[dev-dependencies]
tempfile = "3.24.0"
