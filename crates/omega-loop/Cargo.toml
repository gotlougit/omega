[package]
name = "omega-loop"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[dependencies]
# Workspace crates
omega-core = { path = "../omega-core" }
omega-llm = { path = "../omega-llm" }
omega-projects = { path = "../omega-projects" }
omega-protocol = { path = "../omega-protocol" }
omega-sh-client = { path = "../omega-sh-client" }
omega-tools = { path = "../omega-tools" }

# Async runtime
tokio = { version = "1.0", features = ["full", "sync", "net", "io-util", "process"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Async streams
futures = "0.3"

# Time / metadata
chrono = { version = "0.4", features = ["serde"] }

# Text processing
regex = "1.12.2"

# Async traits
async-trait = "0.1"

# Encoding
base64 = "0.23"

[dev-dependencies]
tempfile = "3.24.0"
omega-loop-client = { path = "../omega-loop-client" }
