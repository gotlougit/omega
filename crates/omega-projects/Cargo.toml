[package]
name = "omega-projects"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Git-worktree-based project store for omega agent sessions"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["process", "fs", "time"] }
tracing = "0.1"
uuid = { version = "1.0", features = ["v4"] }

[dev-dependencies]
tempfile = "3.24.0"
tokio = { version = "1.0", features = ["macros", "rt-multi-thread", "process", "fs"] }
